/// @file PB_RailMeasure.proto
/// @brief Voltage and current measured on a power rail.

syntax = "proto3";

message PB_RailMeasure {
    uint32 voltage_mv = 1; ///< Rail voltage in millivolts
    uint32 current_ma = 2; ///< Rail current in milliamps
}
